workflows:
  herdharbor-ios-testflight:
    name: HerdHarbor iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: HerdHarbor
    environment:
      node: 22
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ebrllc.herdharbor
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install JavaScript and Capacitor dependencies
        script: npm ci
      - name: Build privacy-safe JavaScript monitoring assets
        script: |
          if [ -z "${HERDHARBOR_SENTRY_DSN:-}" ]; then
            echo "Set HERDHARBOR_SENTRY_DSN as a Codemagic secure environment variable." >&2
            exit 1
          fi
          export HERDHARBOR_MONITORING_ENVIRONMENT=production
          export HERDHARBOR_BUILD_ID="ios-${BUILD_NUMBER:-unknown}"
          npm run build:monitoring
          npm run build:monitoring-config
      - name: Stage HerdHarbor web assets and synchronize iOS
        script: npm run sync:ios
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Set version and build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version 1.5.1
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Codemagic BUILD_NUMBER must be numeric." >&2
            exit 1
          fi
          APPLE_BUILD_NUMBER="$BUILD_NUMBER"
          if [ "$APPLE_BUILD_NUMBER" -lt 10 ]; then APPLE_BUILD_NUMBER=10; fi
          agvtool new-version -all "$APPLE_BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
