workflows:
  herdharbor-ios-testflight:
    name: HerdHarbor iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: HerdHarbor
    environment:
      node: 22
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ebrllc.herdharbor
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install JavaScript and Capacitor dependencies
        script: npm ci
      - name: Stage HerdHarbor web assets and synchronize iOS
        script: npm run sync:ios
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Set version and build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version 1.5.0
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
