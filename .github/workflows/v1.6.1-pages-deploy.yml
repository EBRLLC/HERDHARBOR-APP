name: HerdHarbor Pages deploy with v1.6.1 monitoring

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: herdharbor-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned monitoring dependencies
        run: npm ci --no-audit --no-fund
      - name: Require production Sentry DSN
        env:
          HERDHARBOR_SENTRY_DSN: ${{ secrets.HERDHARBOR_SENTRY_DSN }}
        run: test -n "$HERDHARBOR_SENTRY_DSN"
      - name: Build production monitoring assets
        env:
          HERDHARBOR_SENTRY_DSN: ${{ secrets.HERDHARBOR_SENTRY_DSN }}
          HERDHARBOR_MONITORING_ENVIRONMENT: production
          HERDHARBOR_BUILD_ID: ${{ github.sha }}
        run: |
          NODE_ENV=production npm run build:monitoring
          npm run build:monitoring-config
      - name: Stage static Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='monitoring/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ _site/
          test -s _site/herdharbor-monitoring-config.js
          test -s _site/vendor/herdharbor-monitoring-v1.6.1.min.js
          ! grep -q 'dsn: ""' _site/herdharbor-monitoring-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
