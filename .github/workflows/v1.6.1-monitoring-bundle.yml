name: Alpha v1.6.1 monitoring bundle

on:
  push:
    branches: [agent/v1.6.1-crash-monitoring, agent/v1.6.1-admin-members]
    paths:
      - package.json
      - monitoring/**
      - scripts/build-monitoring.mjs
      - .github/workflows/v1.6.1-monitoring-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: herdharbor-v1.6.1-monitoring-bundle
  cancel-in-progress: true

jobs:
  bundle:
    if: startsWith(github.ref, 'refs/heads/agent/v1.6.1-') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Synchronize latest review branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned monitoring dependencies
        run: npm ci --no-audit --no-fund
      - name: Build reusable browser monitoring bundle
        run: NODE_ENV=production npm run build:monitoring
      - name: Commit generated bundle and lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json vendor/herdharbor-monitoring-v1.6.1.min.js
          if git diff --cached --quiet; then
            echo "Monitoring bundle is already current."
          else
            git commit -m "Build Alpha v1.6.1 Sentry browser bundle"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
