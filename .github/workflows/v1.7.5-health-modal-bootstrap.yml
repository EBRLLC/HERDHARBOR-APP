name: Bootstrap v1.7.5 Health modal viewport hotfix

on:
  push:
    branches: [hotfix/v1.7.5-health-modal-viewport]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shell cache and health hotfix activation
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old_build = '<script src="herdharbor-build.js?v=1.7.1"></script>'
          new_build = '<script src="herdharbor-build.js?v=1.7.1&hotfix=health-ui-1"></script>'
          if old_build not in html:
              raise SystemExit('current HerdHarbor build script tag not found')
          index.write_text(html.replace(old_build, new_build, 1))

          worker = Path('service-worker.js')
          sw = worker.read_text()
          old_cache = 'herdharbor-shell-v1.7.1-alpha-multispecies-genetics-foundation-1-hotfix-1-dom-observer-recovery-1'
          new_cache = old_cache + '-health-ui-recovery-1'
          if old_cache not in sw:
              raise SystemExit('current service-worker cache identity not found')
          sw = sw.replace(old_cache, new_cache, 1)

          shell_anchor = '  "./health-intelligence-v1.7.1.css?v=1.7.1",\n'
          shell_insert = shell_anchor + '  "./health-intelligence-ui-hotfix-v1.7.5.css?v=1",\n  "./health-intelligence-ui-hotfix-v1.7.5.js?v=1",\n'
          if shell_anchor not in sw:
              raise SystemExit('Health Intelligence app-shell anchor not found')
          sw = sw.replace(shell_anchor, shell_insert, 1)

          network_anchor = '  "/health-intelligence-v1.7.1.css",\n'
          network_insert = network_anchor + '  "/health-intelligence-ui-hotfix-v1.7.5.css",\n  "/health-intelligence-ui-hotfix-v1.7.5.js",\n'
          if network_anchor not in sw:
              raise SystemExit('Health Intelligence network-first anchor not found')
          sw = sw.replace(network_anchor, network_insert, 1)
          worker.write_text(sw)
      - name: Run focused Health UI regression
        run: node --test tests/health-intelligence-ui-hotfix-v1.7.5.test.cjs
      - name: Run full HerdHarbor regression suite
        run: npm ci --no-audit --no-fund && npm test
      - name: Commit validated hotfix shell changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Activate Health modal viewport hotfix"
          git push origin HEAD:hotfix/v1.7.5-health-modal-viewport
