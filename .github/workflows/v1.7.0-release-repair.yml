name: Alpha v1.7.0 release contract repair

on:
  push:
    branches:
      - release/v1.7.0-live
    paths:
      - .github/workflows/v1.7.0-release-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.7.0-live
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update stale current-release contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current_release_tests = [
              "tests/analytics-release-contract-v1.6.5.test.cjs",
              "tests/breeding-intelligence-tools.test.cjs",
              "tests/genetics-routing-completion-v1.6.1.test.cjs",
              "tests/google-play-readiness.test.cjs",
              "tests/launch-hardening.test.cjs",
              "tests/monitoring-deployment-v1.5.1.test.cjs",
              "tests/monitoring-integration-v1.5.1.test.cjs",
              "tests/phase2-release-v1.6.1.test.cjs",
              "tests/phase3-integration.test.cjs",
              "tests/pwa-update-regression-v1.5.0.test.cjs",
              "tests/runtime-consolidation-v1.5.1.test.cjs",
              "tests/shows-performance-v1.5.0.test.cjs",
              "tests/stability-release.test.cjs",
              "tests/tablet-layout-login-color.test.cjs",
          ]

          for filename in current_release_tests:
              path = Path(filename)
              text = path.read_text()
              updated = text.replace("1.6.7", "1.7.0").replace("completion-debt-1", "arba-standards-1")
              if updated == text:
                  print(f"No stale current-release token found in {filename}")
              else:
                  path.write_text(updated)
                  print(f"Updated {filename}")

          completion = Path("tests/completion-release-contract-v1.6.7.test.cjs")
          text = completion.read_text()
          updated = text.replace(
              "tests/current-release-reference-audit-v1.6.7.test.cjs",
              "tests/current-release-reference-audit-v1.7.0.test.cjs",
          )
          if updated == text:
              print("Completion contract already points to the v1.7.0 current-release audit")
          else:
              completion.write_text(updated)
              print("Updated completion regression to use the v1.7.0 current-release audit")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build monitoring bundle
        env:
          NODE_ENV: production
        run: npm run build:monitoring

      - name: Run full Alpha v1.7.0 test suite
        run: npm test

      - name: Run all regression contracts in UTC and Eastern time
        shell: bash
        run: |
          for test_file in tests/*.test.cjs; do
            TZ=UTC node "$test_file"
            TZ=America/New_York node "$test_file"
          done

      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/v1.7.0-release-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Fix stale release contracts for Alpha v1.7.0"
          git push origin HEAD:release/v1.7.0-live
