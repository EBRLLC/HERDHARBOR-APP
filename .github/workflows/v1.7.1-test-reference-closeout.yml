name: One-time Alpha v1.7.1 regression reference closeout

on:
  push:
    branches: [v1.7.1-multispecies-genetics-foundation]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7.1-multispecies-genetics-foundation
          fetch-depth: 0
      - name: Advance inherited current-release assertions to v1.7.1
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          safe_version_files = [
              'tests/analytics-release-contract-v1.6.5.test.cjs',
              'tests/breeding-intelligence-tools.test.cjs',
              'tests/genetics-routing-completion-v1.6.1.test.cjs',
              'tests/google-play-readiness.test.cjs',
              'tests/junior-entry-paths-v1.5.1.test.cjs',
              'tests/launch-hardening.test.cjs',
              'tests/monitoring-deployment-v1.5.1.test.cjs',
              'tests/monitoring-integration-v1.5.1.test.cjs',
              'tests/pedigree-storage.test.cjs',
              'tests/phase2-release-v1.6.1.test.cjs',
              'tests/pwa-update-regression-v1.5.0.test.cjs',
              'tests/shows-performance-v1.5.0.test.cjs',
              'tests/stability-release.test.cjs',
              'tests/storage-efficiency.test.cjs',
              'tests/tablet-layout-login-color.test.cjs',
          ]
          changed = []
          for name in safe_version_files:
              p = root / name
              text = p.read_text()
              new = text.replace(r'1\.7\.0', r'1\.7\.1')
              if new != text:
                  p.write_text(new)
                  changed.append(name)

          p = root / 'tests/phase3-integration.test.cjs'
          text = p.read_text()
          new = text.replace('multispecies-genetics-v1.6.1.js', 'multispecies-genetics-v1.7.1.js')
          new = new.replace(r'herdharbor-shell-v1\.7\.0-alpha-arba-standards-1', r'herdharbor-shell-v1\.7\.1-alpha-multispecies-genetics-foundation-1')
          new = new.replace('assert.match(engine,/speciesRuleVersion/);assert.match(engine,/calculationStage/);', 'assert.match(engine,/geneticsContractVersion/);assert.match(engine,/exactPredictionsAvailable/);')
          new = new.replace("test('monitoring metadata avoids animal names and includes calculation context'", "test('shared genetics contract avoids animal-name telemetry and exposes calculation capability context'")
          if new != text:
              p.write_text(new)
              changed.append(str(p))

          p = root / 'tests/standards-v1.7.0.test.cjs'
          text = p.read_text()
          new = text.replace(r'standards-ui-v1\.7\.0\.js\?v=1\.7\.0', r'standards-ui-v1\.7\.0\.js\?v=1\.7\.1')
          if new != text:
              p.write_text(new)
              changed.append(str(p))

          p = root / 'tests/standards-youth-guides-v1.7.0.test.cjs'
          text = p.read_text()
          new = text.replace('assert.match(build,/buildId: "arba-standards-1"/);', 'assert.match(build,/buildId: "multispecies-genetics-foundation-1"/);')
          new = new.replace(r'assert.match(sw,/herdharbor-shell-v1\.7\.0-alpha-arba-standards-1/);', r'assert.match(sw,/herdharbor-shell-v1\.7\.1-alpha-multispecies-genetics-foundation-1/);')
          if new != text:
              p.write_text(new)
              changed.append(str(p))

          diagnostic = root / 'tests/000-v171-diagnostic.test.cjs'
          if diagnostic.exists():
              diagnostic.unlink()
              changed.append(str(diagnostic))

          workflow = root / '.github/workflows/v1.7.1-test-reference-closeout.yml'
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow))

          print('Updated files:')
          for name in changed:
              print(' -', name)
          PY
      - name: Commit one-time closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Close Alpha v1.7.1 inherited regression references"
          git push origin HEAD:v1.7.1-multispecies-genetics-foundation
