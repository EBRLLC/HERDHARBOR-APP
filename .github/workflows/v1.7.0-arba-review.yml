name: Alpha v1.7.0 ARBA standards review

on:
  push:
    branches:
      - feature/v1.7.0-arba-standards
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v1.7.0-arba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all HerdHarbor tests
        run: npm test
      - name: Syntax-check v1.7.0 runtime modules
        run: |
          node --check standards-registry-v1.7.0.js
          node --check standards-ui-v1.7.0.js
