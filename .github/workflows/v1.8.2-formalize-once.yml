name: Finalize Alpha v1.8.2 once

on:
  push:
    branches: [v1.8.2-formal-release]

permissions:
  contents: write

concurrency:
  group: herdharbor-v1.8.2-formalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[formalized-v1.8.2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.2-formal-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare deterministic finalizer
        run: node scripts/prepare-formalizer-v1.8.2.mjs
      - name: Apply deterministic release identity changes
        run: node scripts/formalize-v1.8.2.mjs
      - name: Migrate stale release regression guards
        run: node scripts/migrate-v1.8.2-regression-contracts.mjs
      - name: Close remaining release identity gaps
        run: node scripts/finish-v1.8.2-release-contracts.mjs
      - name: Close final regression tail
        run: node scripts/finish-v1.8.2-regression-tail.mjs
      - name: Guard carried-forward runtime filenames
        run: node scripts/guard-v1.8.2-carried-forward-assets.mjs
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify formal release contract
        run: npm run test:release
      - name: Verify lifecycle state integrity
        env:
          TZ: America/New_York
        run: npm run test:state-integrity
      - name: Run complete regression suite
        env:
          TZ: UTC
        run: npm test
      - name: Remove one-time release scripts
        run: rm scripts/prepare-formalizer-v1.8.2.mjs scripts/formalize-v1.8.2.mjs scripts/migrate-v1.8.2-regression-contracts.mjs scripts/finish-v1.8.2-release-contracts.mjs scripts/finish-v1.8.2-regression-tail.mjs scripts/guard-v1.8.2-carried-forward-assets.mjs
      - name: Preserve API-staged workflow files
        run: git checkout HEAD -- .github/workflows
      - name: Commit finalized non-workflow release tree
        run: |
          git config user.name "HerdHarbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Alpha v1.8.2 release tree [formalized-v1.8.2]"
          git push origin HEAD:v1.8.2-formal-release
