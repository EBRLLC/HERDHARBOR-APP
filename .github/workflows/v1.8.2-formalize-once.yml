name: Finalize Alpha v1.8.2 once

on:
  push:
    branches: [v1.8.2-formal-release]

permissions:
  contents: write

concurrency:
  group: herdharbor-v1.8.2-formalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[formalized-v1.8.2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.2-formal-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare deterministic finalizer
        run: node scripts/prepare-formalizer-v1.8.2.mjs
      - name: Apply deterministic release identity changes
        run: node scripts/formalize-v1.8.2.mjs
      - name: Migrate stale release regression guards
        run: node scripts/migrate-v1.8.2-regression-contracts.mjs
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify formal release contract
        run: npm run test:release
      - name: Verify lifecycle state integrity
        env:
          TZ: America/New_York
        run: npm run test:state-integrity
      - name: Run complete regression suite
        env:
          TZ: UTC
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/herdharbor-v1.8.2-regression.log
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v1.8.2-regression-${{ github.run_id }}
          path: /tmp/herdharbor-v1.8.2-regression.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove one-time finalizer
        run: rm scripts/prepare-formalizer-v1.8.2.mjs scripts/formalize-v1.8.2.mjs scripts/migrate-v1.8.2-regression-contracts.mjs .github/workflows/v1.8.2-formalize-once.yml
      - name: Commit finalized release tree
        run: |
          git config user.name "HerdHarbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Alpha v1.8.2 release identity [formalized-v1.8.2]"
          git push origin HEAD:v1.8.2-formal-release
