name: Alpha v1.5.1 monitoring bundle

on:
  push:
    branches: [agent/v1.5.1-crash-monitoring]
    paths:
      - package.json
      - monitoring/**
      - scripts/build-monitoring.mjs
      - .github/workflows/v1.5.1-monitoring-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: herdharbor-v1.5.1-monitoring-bundle
  cancel-in-progress: true

jobs:
  bundle:
    if: github.ref == 'refs/heads/agent/v1.5.1-crash-monitoring' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.5.1-crash-monitoring
      - name: Synchronize latest review branch
        run: |
          git fetch origin agent/v1.5.1-crash-monitoring
          git reset --hard origin/agent/v1.5.1-crash-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned monitoring dependencies
        run: npm install --no-audit --no-fund
      - name: Build reusable browser monitoring bundle
        run: NODE_ENV=production npm run build:monitoring
      - name: Commit generated bundle and lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json vendor/herdharbor-monitoring-v1.5.1.min.js
          if git diff --cached --quiet; then
            echo "Monitoring bundle is already current."
          else
            git commit -m "Build Alpha v1.5.1 Sentry browser bundle"
            git pull --rebase origin agent/v1.5.1-crash-monitoring
            git push origin HEAD:agent/v1.5.1-crash-monitoring
          fi
