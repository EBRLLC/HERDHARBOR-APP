name: HerdHarbor 2.0.2 release-candidate CI

on:
  pull_request:
    branches: [main, 'feature/2.0.1-canine-*', 'herdharbor-2.0.1/**', 'release-2.0.0-phase-*', 'breeder-docs/phase-*', 'breeding-intel/phase-*', 'marketplace-site/app-*', 'marketplace-comms/app-*', 'ownership-transfer/phase-*']
  workflow_dispatch:
    inputs:
      run_staging_auth:
        description: 'Execute real GoTrue/JWT and normalized HTTP staging integration using synthetic secret-backed users'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: herdharbor-v2.0.2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-regression:
    name: Web, security and regression
    runs-on: ubuntu-latest
    # Ephemeral CI-only database; no Supabase project, tenant data or paid branch.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: herdharbor_s19_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d herdharbor_s19_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Marketplace Edge Function TypeScript
        run: |
          npx esbuild supabase/functions/marketplace-sso-ticket/index.ts --format=esm --platform=neutral --log-level=error --outfile=/tmp/marketplace-sso-ticket.mjs
          npx esbuild supabase/functions/marketplace-public-media/index.ts --format=esm --platform=neutral --log-level=error --outfile=/tmp/marketplace-public-media.mjs
          npx esbuild supabase/functions/marketplace-pedigree-snapshot/index.ts --format=esm --platform=neutral --log-level=error --outfile=/tmp/marketplace-pedigree-snapshot.mjs
          npx esbuild supabase/functions/animal-transfer/index.ts --format=esm --platform=neutral --log-level=error --outfile=/tmp/animal-transfer.mjs
          npx esbuild supabase/functions/paper-pedigree-extract/index.ts --bundle --format=esm --platform=neutral --external:npm:* --log-level=error --outfile=/tmp/hh-ai-paper-2.0.1.mjs
          npx esbuild supabase/functions/record-photo-extract/index.ts --bundle --format=esm --platform=neutral --external:npm:* --log-level=error --outfile=/tmp/hh-ai-photo-2.0.1.mjs
      - name: Syntax-check real staging HTTP/JWT acceptance without contacting staging
        run: node --check scripts/v2.0.2-staging-auth-http-acceptance.mjs
      - name: Verify repository governance and current 2.0.2 release-candidate contract
        run: npm run test:release
      - name: Verify canonical engine ownership explicitly
        run: npm run test:governance
      - name: Run lifecycle state-integrity E2E gate
        run: npm run test:state-integrity
      - name: Validate integrated 2.0.2 cloud, canine and optional-AI review contract
        run: npm run test:v2.0.2-review
      - name: Verify independent encrypted archive restoration in disposable PostgreSQL 17
        env:
          HH_RECOVERY_POSTGRES_CI: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: herdharbor_s19_restore
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          pg_isready -h 127.0.0.1 -U postgres -d herdharbor_s19_restore
          node --test tests/v2.0.2-postgres-restore.test.cjs
          node --test tests/v2.0.2-recovery-rollback-guard.test.cjs
           node --test tests/v2.0.2-auth-only-recovery-sql.test.cjs
      - name: Run complete HerdHarbor regression suite in UTC
        env:
          TZ: UTC
        run: |
          failed=0
          for test_file in tests/*.test.cjs; do
            echo "::group::${test_file}"
            node --test "${test_file}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Run complete HerdHarbor regression suite in America/New_York
        env:
          TZ: America/New_York
        run: |
          failed=0
          for test_file in tests/*.test.cjs; do
            echo "::group::${test_file}"
            node --test "${test_file}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Build production monitoring bundle
        run: NODE_ENV=production npm run build:monitoring
      - name: Verify bundled monitoring architecture
        run: |
          test -s vendor/herdharbor-monitoring-v1.6.1.min.js
          grep -q '@sentry/browser' monitoring/herdharbor-monitoring-browser.mjs
          ! grep -Eqi 'browser\.sentry-cdn\.com|loader\.js' monitoring/herdharbor-monitoring-browser.mjs index.html pwa.js
      - name: Verify environment-driven monitoring configuration
        env:
          HERDHARBOR_SENTRY_DSN: https://public@example.invalid/123
          HERDHARBOR_MONITORING_ENVIRONMENT: test
          HERDHARBOR_BUILD_ID: ci-v2.0.2
          HERDHARBOR_ENABLE_MONITORING_TEST: "true"
        run: |
          npm run build:monitoring-config
          grep -q '"environment": "test"' herdharbor-monitoring-config.js
          grep -q '"release": "HerdHarbor@2.0.2"' herdharbor-monitoring-config.js
          grep -q '"build": "ci-v2.0.2"' herdharbor-monitoring-config.js
          grep -q '"enableTestCrash": true' herdharbor-monitoring-config.js
          git checkout -- herdharbor-monitoring-config.js
      - name: Generate and validate a fingerprinted Pages release candidate without publishing
        env:
          HERDHARBOR_SENTRY_DSN: https://public@example.invalid/123
          HERDHARBOR_MONITORING_ENVIRONMENT: production
        run: |
          HERDHARBOR_BUILD_ID="$(git rev-parse HEAD)" npm run build:monitoring-config
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='monitoring/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ _site/
          node scripts/generate-release-assets.mjs _site
          node scripts/verify-release-candidate-artifact.mjs _site
          git checkout -- herdharbor-monitoring-config.js
      - name: Ensure tests and build did not mutate source
        run: git diff --exit-code -- . ':!vendor/herdharbor-monitoring-v1.6.1.min.js' ':!herdharbor-monitoring-config.js'
      - uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v2.0.2-monitoring-bundle
          path: vendor/herdharbor-monitoring-v1.6.1.min.js
          if-no-files-found: error
          retention-days: 14

  android-review:
    name: Android 2.0.2 review bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android release identity
        run: |
          grep -q 'versionName "2.0.2"' android/app/build.gradle
          grep -q 'versionCode 21' android/app/build.gradle
          grep -q '"appVersion": "2.0.2"' twa-manifest.json
          grep -q '"appVersionCode": 21' twa-manifest.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # The action default still requests the retired SDK package named `tools`.
          # Install only platform-tools here; the required Android 16 SDK is pinned below.
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned release bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify unsigned bundle
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v2.0.2-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  pages-release-readiness:
    name: Pages source readiness (2.0.2 release hold)
    if: github.event_name == 'pull_request' && github.head_ref == 'release/2.0.2-normalized-cloud'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Verify Pages source is GitHub Actions before 2.0.2 merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          repo = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pages",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  settings = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError) as exc:
              print(f"::error title=Pages source not verified::Could not read GitHub Pages source: {type(exc).__name__}. A verified GitHub Actions Pages source is required before #505 merges.")
              sys.exit(1)
          kind = settings.get("build_type")
          if kind != "workflow":
              print(f"::error title=Unsafe Pages publishing configuration::Pages build_type={kind!r}. Open Settings > Pages > Build and deployment > Source and select GitHub Actions BEFORE merging #505. Branch publishing could expose unverified raw main files.")
              sys.exit(1)
          print("2.0.2 pre-merge Pages source check PASS: GitHub Actions workflow.")
          PY

  canine-pdf-render-acceptance:
    name: Real canine PDF render (Letter/A4, 3/4 generations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check actual PDF rendering tools
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          command -v pdftotext
      - name: Render and verify genuine pedigree PDF text
        run: node scripts/verify-canine-pdf-render.cjs

  staging-authenticated-http:
    name: Real GoTrue staging Auth/REST/RPC (manual isolated gate)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/2.0.2-normalized-cloud' && inputs.run_staging_auth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify staging-only auth test prerequisites
        env:
          HH_STAGE_SUPABASE_URL: ${{ vars.HH_STAGE_SUPABASE_URL }}
          HH_STAGE_PUBLISHABLE_KEY: ${{ secrets.HH_STAGE_PUBLISHABLE_KEY }}
          HH_STAGE_USER_A_EMAIL: ${{ secrets.HH_STAGE_USER_A_EMAIL }}
          HH_STAGE_USER_A_PASSWORD: ${{ secrets.HH_STAGE_USER_A_PASSWORD }}
          HH_STAGE_USER_B_EMAIL: ${{ secrets.HH_STAGE_USER_B_EMAIL }}
          HH_STAGE_USER_B_PASSWORD: ${{ secrets.HH_STAGE_USER_B_PASSWORD }}
          HH_STAGE_USER_C_EMAIL: ${{ secrets.HH_STAGE_USER_C_EMAIL }}
          HH_STAGE_USER_C_PASSWORD: ${{ secrets.HH_STAGE_USER_C_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/v2.0.2-staging-auth-http-acceptance.mjs
