name: Apply v1.8.2 analytics animal scope once

on:
  push:
    branches: [v1.8.2-formal-release]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[analytics-scope-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.2-formal-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply analytics animal scope patch
        run: node scripts/apply-analytics-animal-scope-v1.8.2.mjs
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Run analytics scope tests
        run: node --test tests/analytics-v1.6.1.test.cjs tests/analytics-animal-scope-v1.8.2.test.cjs
      - name: Run full regression suite
        run: npm test
      - name: Remove one-time patch script
        run: rm scripts/apply-analytics-animal-scope-v1.8.2.mjs
      - name: Commit tested analytics update
        run: |
          git config user.name "HerdHarbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics-v1.6.1.js tests/analytics-animal-scope-v1.8.2.test.cjs RELEASE_NOTES-v1.8.2.md scripts/apply-analytics-animal-scope-v1.8.2.mjs
          git commit -m "Analytics: default growth selector to current animals [analytics-scope-applied]"
          git push origin HEAD:v1.8.2-formal-release
