name: Repair Alpha v1.6.5 review branch

on:
  push:
    branches:
      - v1.6.5-analytics-market-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.6.5-analytics-market-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore exact local e62a71b index and apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6cb7db57e359c47a5a87430a0abcbf54d49232cd -- index.html
          python repair/recover-index.py
          test "$(git hash-object index.html)" = "ed1994703df927c4d00994c94747d6f3ef2b8d21"
          python repair/v165-review-fixes.py

      - name: Run complete regression suite in UTC and America/New_York
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          NODE_ENV=production npm run build:monitoring
          for test_file in tests/*.test.cjs; do
            TZ=UTC node "$test_file"
          done
          for test_file in tests/*.test.cjs; do
            TZ=America/New_York node "$test_file"
          done

      - name: Commit repaired review branch
        shell: bash
        run: |
          set -euo pipefail
          git restore vendor/herdharbor-monitoring-v1.6.1.min.js 2>/dev/null || true
          rm -f repair/index-e62a71b.patch repair/recover-index.py repair/v165-review-fixes.py .github/workflows/repair-v1.6.5.yml
          rmdir repair 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair v1.6.5 index and review findings"
          git push origin HEAD:v1.6.5-analytics-market-foundation

# Deterministic parser recovery trigger.
