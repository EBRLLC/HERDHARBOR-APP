name: Alpha v1.6.7 one-time Sentry acceptance

on:
  push:
    branches: [v1.6.7-production-closeout]

permissions:
  contents: read

jobs:
  sentry-production-acceptance:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send synthetic-only Sentry production acceptance event
        env:
          HERDHARBOR_SENTRY_DSN: ${{ secrets.HERDHARBOR_SENTRY_DSN }}
        run: node scripts/sentry-production-acceptance.mjs
