name: Alpha v1.6.7 final protected production acceptance

on:
  push:
    branches: [v1.6.7-final-production-acceptance]

permissions:
  contents: read

jobs:
  production-acceptance:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved v1.6.7 release
        uses: actions/checkout@v4
        with:
          ref: 65fa177645897de272784ac60a059d58af0f4707
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved completion contract
        run: |
          npm ci --no-audit --no-fund
          npm run test:completion
      - name: Run synthetic-only Sentry production acceptance
        env:
          HERDHARBOR_SENTRY_DSN: ${{ secrets.HERDHARBOR_SENTRY_DSN }}
        run: node scripts/sentry-production-acceptance.mjs
      - name: Final acceptance summary
        run: |
          echo "Alpha v1.6.7 protected acceptance passed on reviewed release 65fa177645897de272784ac60a059d58af0f4707."
          echo "Invocation equivalent: deploy_market=false, run_membership=false, run_sentry=true."
          echo "Market deployment/privacy and membership/RLS production acceptance were completed independently before this protected gate."
