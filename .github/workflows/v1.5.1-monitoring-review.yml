name: Alpha v1.5.1 crash monitoring review

on:
  push:
    branches: [agent/v1.5.1-crash-monitoring]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned monitoring dependencies
        run: npm install --no-audit --no-fund
      - name: Build production monitoring bundle
        run: NODE_ENV=production npm run build:monitoring
      - name: Verify built monitoring asset
        run: |
          test -s vendor/herdharbor-monitoring-v1.5.1.min.js
          ! grep -q "browser.sentry-cdn.com" vendor/herdharbor-monitoring-v1.5.1.min.js
      - name: Run complete HerdHarbor regression suite in UTC
        run: |
          for test_file in tests/*.test.cjs; do
            TZ=UTC node "$test_file"
          done
      - name: Run complete HerdHarbor regression suite in America/New_York
        run: |
          for test_file in tests/*.test.cjs; do
            TZ=America/New_York node "$test_file"
          done
      - name: Verify environment-driven DSN configuration generation
        env:
          HERDHARBOR_SENTRY_DSN: https://public@example.invalid/123
          HERDHARBOR_MONITORING_ENVIRONMENT: test
          HERDHARBOR_BUILD_ID: ci-monitoring-test
          HERDHARBOR_ENABLE_MONITORING_TEST: "true"
        run: |
          npm run build:monitoring-config
          grep -q '"environment": "test"' herdharbor-monitoring-config.js
          grep -q '"build": "ci-monitoring-test"' herdharbor-monitoring-config.js
          grep -q '"enableTestCrash": true' herdharbor-monitoring-config.js
          git checkout -- herdharbor-monitoring-config.js
      - name: Ensure tests/build did not mutate source
        run: git diff --exit-code -- . ':!vendor/herdharbor-monitoring-v1.5.1.min.js' ':!package-lock.json'
      - uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v1.5.1-monitoring-review-bundle
          path: vendor/herdharbor-monitoring-v1.5.1.min.js
          if-no-files-found: error
          retention-days: 14
