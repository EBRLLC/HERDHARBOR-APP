name: Alpha v1.7.1 release review

on:
  push:
    branches: [v1.7.1-multispecies-genetics-foundation, 'fix/v1.7.1-*', 'feature/v1.7.1-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genetics-and-regression:
    name: Multi-species genetics, health, and regression
    if: github.event_name != 'pull_request' || github.head_ref == 'v1.7.1-multispecies-genetics-foundation' || startsWith(github.head_ref, 'fix/v1.7.1-') || startsWith(github.head_ref, 'feature/v1.7.1-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Run v1.7.1 focused contract
        run: npm run test:v1.7.1
      - name: Run genetics regression contract
        run: npm run test:genetics
      - name: Run health regression contract
        run: npm run test:health
      - name: Run complete HerdHarbor regression suite in UTC
        run: TZ=UTC npm test
      - name: Verify architecture-only non-rabbit adapters
        run: |
          node - <<'NODE'
          const G = require('./multispecies-genetics-v1.7.1.js');
          const expected = {
            cattle: 'v1.7.2',
            goat: 'v1.7.3',
            sheep: 'v1.7.3',
            poultry: 'v1.7.4',
            swine: 'v1.7.5'
          };
          if (G.VERSION !== '1.7.1' || G.SCHEMA_VERSION !== 4) throw new Error('Wrong shared genetics contract identity.');
          if (G.getAdapter('rabbit')?.status !== 'production') throw new Error('Rabbit adapter must remain production.');
          for (const [species, nextRelease] of Object.entries(expected)) {
            const adapter = G.getAdapter(species);
            if (!adapter || adapter.status !== 'foundation') throw new Error(`${species} adapter is not foundation-only.`);
            if (adapter.nextRelease !== nextRelease) throw new Error(`${species} next release contract is incorrect.`);
            if (G.listTraits(species).length || G.listLoci(species).length) throw new Error(`${species} unexpectedly ships production trait/locus claims in v1.7.1.`);
          }
          if (G.getAdapter('poultry')?.chromosomeSystem !== 'ZW') throw new Error('Poultry ZW capability contract missing.');
          NODE
      - name: Build production monitoring bundle
        run: NODE_ENV=production npm run build:monitoring
      - name: Verify tests/build did not mutate tracked source
        run: git diff --exit-code -- . ':!vendor/herdharbor-monitoring-v1.6.1.min.js'
      - uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v1.7.1-monitoring-review-bundle
          path: vendor/herdharbor-monitoring-v1.6.1.min.js
          if-no-files-found: error
          retention-days: 14

  android-review-build:
    name: Android v1.7.1 review build
    if: github.event_name != 'pull_request' || github.head_ref == 'v1.7.1-multispecies-genetics-foundation' || startsWith(github.head_ref, 'fix/v1.7.1-') || startsWith(github.head_ref, 'feature/v1.7.1-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Android release identity
        run: |
          grep -q 'versionCode 14' android/app/build.gradle
          grep -q 'versionName "1.7.1"' android/app/build.gradle
          grep -q '"appVersion": "1.7.1"' twa-manifest.json
          grep -q '"appVersionCode": 14' twa-manifest.json
      - name: Build unsigned Android review bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify unsigned review bundle
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: herdharbor-v1.7.1-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
