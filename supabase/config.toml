project_id = "okynebbksifqppwicghj"

[functions.market-contribution]
# This function validates the Bearer token with Supabase Auth in code before
# calling service-role-only RPCs. This supports current asymmetric signing keys.
verify_jwt = false

[functions.registration-profile]
# Registration profiles contain private identity/contact details and are only
# accepted from a signed-in HerdHarbor user.
verify_jwt = true

[functions.registration-referral]
# Referral-code validation and pre-auth signup intent staging are intentionally
# available before sign-in and return no referring-member identity. Signed-in
# status/complete actions validate the Bearer token in code.
verify_jwt = false

[functions.subscription-billing]
# Member billing and Admin subscription actions require an authenticated HerdHarbor user.
verify_jwt = true

[functions.subscription-webhook]
# Stripe cannot send a Supabase user JWT. The function authenticates Stripe by
# verifying the Stripe-Signature header before any database side effects.
verify_jwt = false

[functions.subscription-maintenance]
# The database scheduler cannot send a user JWT. This function requires the
# private X-HerdHarbor-Maintenance token generated and stored server-side.
verify_jwt = false

[functions.email-engine]
# Resend audience and Admin broadcast actions require an authenticated user and
# perform an additional Owner/Admin authorization check where appropriate.
verify_jwt = true
