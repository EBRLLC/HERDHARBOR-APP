<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12343b">
  <title>HerdHarbor Marketplace</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f4f7f8; color: #19333a; }
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .gate-card { width: min(560px, 100%); padding: 28px; background: white; border: 1px solid #dbe5e7; border-radius: 18px; box-shadow: 0 16px 48px rgba(21,54,62,.09); }
    .gate-mark { margin: 0 0 8px; color: #2e7d7b; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .76rem; }
    h1 { margin: 0 0 10px; font-size: clamp(1.7rem,4vw,2.35rem); }
    p { line-height: 1.55; }
    .gate-status { color: #536970; }
    .gate-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .gate-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: #12343b; color: white; text-decoration: none; font-weight: 750; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #0c1e22; color: #e7f0f2; }
      .gate-card { background: #112a30; border-color: #27444b; box-shadow: none; }
      .gate-status { color: #adc0c5; }
      .gate-link { background: #d6ecea; color: #12343b; }
    }
  </style>
</head>
<body>
  <main id="marketplace-access-shell" class="gate" aria-live="polite">
    <section class="gate-card">
      <p class="gate-mark">HerdHarbor</p>
      <h1>Marketplace</h1>
      <p id="marketplace-gate-status" class="gate-status">Checking secure preview access…</p>
      <div id="marketplace-gate-actions" class="gate-actions" hidden>
        <a class="gate-link" href="../">Return to HerdHarbor</a>
      </div>
    </section>
  </main>
  <div id="marketplace-root" hidden></div>

  <script src="../vendor/supabase-2.111.0.js"></script>
  <script src="marketplace-gate-v2.0.1.js?v=1"></script>
</body>
</html>
